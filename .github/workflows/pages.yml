# Deploys app/ to GitHub Pages and stamps the build sha (R6). prove.yml is the course's and stays as shipped.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stamp build sha and config
        env:
          BOARD_API: https://hq.mega.dev/challenges/show-me-when/api
          BOARD_SESSION: ${{ secrets.BOARD_SESSION }}
        run: |
          mkdir -p _site
          cp -r app/. _site/
          [ -d media ] && cp -r media _site/media || true
          sed -i "s/__BUILD_SHA__/${GITHUB_SHA}/g" _site/index.html
          printf "export const API = '%s';\nexport const SESSION = '%s';\n" "$BOARD_API" "$BOARD_SESSION" > _site/config.js
          grep -q "SESSION = 'v1\." _site/config.js
          grep -c "${GITHUB_SHA}" _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
